name: Build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run repository QA gate
        shell: pwsh
        run: ./tools/qa/Test-Automobility.ps1 -CiBuildVerification
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/test-results/
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: automobility-${{ github.sha }}
          path: |
            fabric/build/libs/
            momentum/build/libs/
